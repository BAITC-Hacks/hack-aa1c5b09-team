services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: needboard
      POSTGRES_USER: needboard
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U needboard -d needboard"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
